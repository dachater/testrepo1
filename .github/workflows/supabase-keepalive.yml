# Pings Supabase every few days so the free-tier project isn't paused for inactivity.
# Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
# Scheduled workflows only run from the default branch.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the items table (RLS returns no rows without a login)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1" > /dev/null
